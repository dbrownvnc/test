<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jensen Huang Mindset Quiz - Interactive Test</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#e11d48; --accent2:#f43f5e; --bg:#ffffff; --bg2:#fafafa; --text:#1a1a1a; --text2:#777777; --border:#e5e5e5; --green:#16a34a; --orange:#f59e0b; --red:#ef4444}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); line-height:1.6}
.container{max-width:720px; margin:0 auto; padding:0 16px 120px}
header{padding:26px 0 16px}
header h1{font-family:'Playfair Display',serif; font-size:28px; line-height:1.2}
header p{color:var(--text2); font-size:13px; margin-top:6px}
/* sticky scoreboard */
.scoreboard{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:12px 0; margin:0 -16px; padding-left:16px; padding-right:16px}
.score-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:13px}
.score-row b{font-size:14px}
.progress{height:8px; background:#f1f1f1; border-radius:999px; overflow:hidden; margin-top:10px}
.progress i{display:block; height:100%; width:0%; background:var(--red); transition:width .4s ease, background .4s}
.badge{font-size:11px; padding:3px 8px; border-radius:999px; border:1px solid var(--border); background:#fff}
.badge.easy{color:#16a34a; border-color:#bbf7d0}
.badge.medium{color:#d97706; border-color:#fde68a}
.badge.hard{color:var(--accent); border-color:#fecdd3}
.card{background:var(--bg2); border:1px solid var(--border); border-radius:18px; padding:18px; margin:16px 0; transition:.2s}
.card.solved{border-color:#e5e5e5}
.q-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.q-num{font-family:'Playfair Display',serif; font-weight:800; font-size:18px}
.q-text{font-size:15px; font-weight:500; margin-bottom:12px}
.options{display:grid; gap:8px}
.opt{appearance:none; width:100%; text-align:left; background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14px; cursor:pointer; transition:.18s; position:relative}
.opt:hover{border-color:var(--accent); transform:translateY(-1px)}
.opt:disabled{cursor:default; opacity:.9; transform:none}
.opt.correct{background:#ecfdf5; border-color:var(--green); color:#065f46}
.opt.wrong{background:#fef2f2; border-color:var(--red); color:#991b1b}
.opt.correct::after{content:'✓ 정답!'; position:absolute; right:12px; top:10px; font-size:11px; background:var(--green); color:#fff; padding:2px 6px; border-radius:999px}
.opt.wrong::after{content:'✗ 오답'; position:absolute; right:12px; top:10px; font-size:11px; background:var(--red); color:#fff; padding:2px 6px; border-radius:999px}
.ox-row{display:flex; gap:10px}
.ox-btn{flex:1; padding:14px; border-radius:12px; border:1.5px solid var(--border); background:#fff; font-size:18px; font-weight:800; cursor:pointer}
.ox-btn:disabled{opacity:.9; cursor:default}
.ox-btn.correct{background:#ecfdf5; border-color:var(--green)}
.ox-btn.wrong{background:#fef2f2; border-color:var(--red)}
.short-row{display:flex; gap:8px}
.short-row input{flex:1; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border); font-size:14px}
.short-row input:focus{outline:none; border-color:var(--accent)}
.btn{appearance:none; border:none; background:var(--accent); color:#fff; padding:12px 16px; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer}
.btn:disabled{opacity:.5}
.explain{max-height:0; overflow:hidden; transition:max-height .4s ease, opacity .3s; opacity:0; margin-top:0; background:#fff; border:0px solid var(--border); border-radius:12px; padding:0 14px}
.explain.show{max-height:400px; opacity:1; margin-top:12px; border-width:1px; padding:12px 14px}
.explain b{color:var(--accent); font-size:12px; display:block; margin-bottom:4px}
.explain p{font-size:13px; color:#333}
.final{position:fixed; left:0; right:0; bottom:0; top:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px}
.final.show{display:flex}
.final-card{background:#fff; border-radius:20px; padding:24px; width:100%; max-width:420px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.2)}
.final-card h2{font-family:'Playfair Display'; font-size:24px}
.grade{font-size:48px; font-weight:800; margin:10px 0; color:var(--accent)}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Jensen Huang: Mindset Quiz</h1>
<p>원본 자막 기반 10문제 · 클릭 한 번에 채점 · 해설 자동 표시</p>
</header>

<div class="scoreboard" id="scoreboard">
<div class="score-row">
<span>푼 문제 <b id="solved">0</b> / 10</span>
<span>맞힌 문제 <b id="correct">0</b></span>
<span>정답률 <b id="rate">0%</b></span>
<span class="badge" id="rateBadge">시작</span>
</div>
<div class="progress"><i id="prog"></i></div>
</div>

<div id="quizRoot"></div>
</div>

<div class="final" id="final">
<div class="final-card">
<h2>최종 결과</h2>
<div class="grade" id="finalGrade">A</div>
<p id="finalScore" style="font-size:15px; margin-bottom:6px"></p>
<p id="finalMsg" style="font-size:13px; color:#777; margin-bottom:18px"></p>
<button class="btn" style="width:100%" onclick="restartQuiz()">다시 풀기</button>
</div>
</div>

<script>
const QUIZ_DATA = [
{
id:1, type:'multiple', difficulty:'easy',
question:'NVIDIA가 1993년 처음 풀려고 한 문제는 무엇인가?',
options:['3D 그래픽을 PC에서 가속','엑셀 계산을 빠르게','인터넷 검색 속도 개선','스마트폰 배터리 절약'],
answer:0,
explanation:'정답 이유: 자막 초반 “모든 개인 컴퓨터를 게임 콘솔로 변경할 것” “첫 번째 문제는 3D 그래픽이었다”는 언급이 있습니다. CPU만으로 부족한 3D를 가속하자는 게 출발점이었어요.'
},
{
id:2, type:'multiple', difficulty:'easy',
question:'1995년 NVIDIA가 위기를 자각했을 당시, PC 3D 그래픽을 만들던 경쟁사는 몇 개였나?',
options:['5개','35~40개','100개','1개'],
answer:1,
explanation:'정답 이유: 자막에 “그 당시에는 35, 40개의 다른 기술이 PC에서 3D 그래픽을 구축”이라 명시되어 있습니다. 포화 경쟁 속에서의 피벗 사례입니다.'
},
{
id:3, type:'multiple', difficulty:'medium',
question:'회사가 거의 망할 뻔했을 때 젠슨 황이 서점에서 사온 책의 주제는?',
options:['OpenGL과 OpenGL 파이프라인','자바 프로그래밍','회계 원리','일본어 회화'],
answer:0,
explanation:'정답 이유: 자막 “60, 100달러 가지고 프라이즈에 가서 3개의 책을 샀다. 책은 OpenGL과 OpenGL 파이프라인을 디자인하는 것이었다”가 근거입니다. 이를 기반으로 다시 개발해 리더가 됐어요.'
},
{
id:4, type:'multiple', difficulty:'medium',
question:'SEGA 드림캐스트와 관련된 원래 계약 규모는?',
options:['100만 달러','500만 달러','1200만 달러','3억 달러'],
answer:2,
explanation:'정답 이유: 자막에 SEGA가 12백만 달러 계약을 줬다고 나옵니다. 이후 솔직한 고백으로 5백만 달러를 추가로 지원받아 생존했고, 1999년 3억 달러 매출로 이어졌습니다.'
},
{
id:5, type:'ox', difficulty:'easy',
question:'젠슨 황은 SEGA CEO에게 “기술적으로 구현 불가능하지만 돈이 필요하다”고 솔직하게 말했다.',
options:['O','X'],
answer:0,
explanation:'정답 이유: 자막 “그들은 다른 사람을 선택하도록 권고했지만 돈이 필요하다고 말했다” “당신이 할 수 없지만 돈이 필요하다고 말할 것이다. 정확히 맞다”는 대목이 근거입니다. O가 맞습니다.'
},
{
id:6, type:'multiple', difficulty:'medium',
question:'AlexNet을 보고 젠슨 황이 깨달았다고 말한 핵심 개념은?',
options:['Universal Function Approximator (범용 함수 근사기)','Search Engine','Blockchain','Metaverse'],
answer:0,
explanation:'정답 이유: 자막 “우리는 그냥 유니버셜 function approximator를 발견했다. 거의 모든 function에 대한 답변을 받을 수 있었다”는 직접 언급이 있습니다. 단순 이미지 분류를 넘어선 해석이에요.'
},
{
id:7, type:'multiple', difficulty:'medium',
question:'자막에서 AI 이후 일자리 증가 사례로 언급된 수치는?',
options:['소프트웨어 엔지니어 +10%, 영상의학과 +20%','회계사 -50%','운전사 -100%','교사 +0%'],
answer:0,
explanation:'정답 이유: 자막 “소프트웨어 엔지니어 직업의 숫자가 10% 증가… 라디올로지 직업의 숫자가 지난 몇 년 동안 20% 증가”가 직접 근거. AI는 업무(Task)를 없애지 일자리를 없애지 않는다는 논지입니다.'
},
{
id:8, type:'short', difficulty:'hard',
question:'로봇 학습 3단계 중 첫 단계를 영어로 정확히 쓰세요. (예: Real to Sim)',
options:[],
answer:'real to sim',
explanation:'정답 이유: 자막 “우리는 real to sim을 만들어야 합니다… 시뮬레이션… 마지막은 SIM to REAL” “ISAAC SIM, COSMOS 등 모든 작업이 시뮬레이션”이 근거. 정답은 Real to Sim / Real2Sim 모두 인정됩니다.'
},
{
id:9, type:'ox', difficulty:'medium',
question:'젠슨 황이 에이전트(Hermes, OpenClaw) 시대 가장 큰 돌파구로 꼽은 것은 Controllability(제어 가능성)이다.',
options:['O','X'],
answer:0,
explanation:'정답 이유: 자막 마지막 부분 “controllability is probably the single biggest breakthrough that we need for agents at every single level.” 직접 언급. 한 단어 변화가 미치는 영향을 제어하는 능력이 핵심이라고 했습니다. O'
},
{
id:10, type:'short', difficulty:'hard',
question:'34년간 젠슨 황이 반복한 창업가 마인드셋 문장을 영어로 쓰세요. (4단어)',
options:[],
answer:'how hard can it be',
explanation:'정답 이유: 자막 반복 구절 “How hard can it be?” 창업 전체를 관통하는 문장입니다. “얼마나 어려울 수 있겠어?”라는 태도로 시작하되, 실제로는 훨씬 어렵다는 걸 인정하고 오늘을 버티라는 맥락이었어요.'
}
];

let state = { solved:0, correct:0, answers:{} };

function render(){
 const root=document.getElementById('quizRoot');
 root.innerHTML='';
 QUIZ_DATA.forEach((q, idx)=>{
  const card=document.createElement('div');
  card.className='card';
  card.id='card-'+q.id;
  const diffLabel = q.difficulty==='easy'?'쉬움':q.difficulty==='medium'?'보통':'어려움';
  card.innerHTML=`
   <div class="q-head"><span class="q-num">Q${idx+1}</span><span class="badge ${q.difficulty}">${diffLabel}</span></div>
   <div class="q-text">${q.question}</div>
   <div class="q-body" id="body-${q.id}"></div>
   <div class="explain" id="exp-${q.id}"><b>해설</b><p>${q.explanation}</p></div>
  `;
  root.appendChild(card);
  const body=card.querySelector('#body-'+q.id);
  if(q.type==='multiple'){
   const optWrap=document.createElement('div'); optWrap.className='options';
   q.options.forEach((opt, oi)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=()=>grade(q.id, oi);
    optWrap.appendChild(b);
   });
   body.appendChild(optWrap);
  } else if(q.type==='ox'){
   const row=document.createElement('div'); row.className='ox-row';
   ['O','X'].forEach((label, oi)=>{
    const b=document.createElement('button');
    b.className='ox-btn'; b.textContent=label;
    b.onclick=()=>grade(q.id, oi);
    row.appendChild(b);
   });
   body.appendChild(row);
  } else if(q.type==='short'){
   const row=document.createElement('div'); row.className='short-row';
   const inp=document.createElement('input'); inp.type='text'; inp.placeholder='정답을 입력하세요';
   inp.id='input-'+q.id;
   inp.addEventListener('keydown', e=>{ if(e.key==='Enter') grade(q.id, inp.value); });
   const btn=document.createElement('button'); btn.className='btn'; btn.textContent='제출';
   btn.onclick=()=>grade(q.id, inp.value);
   row.appendChild(inp); row.appendChild(btn);
   body.appendChild(row);
  }
 });
 updateBoard();
}

function normalize(s){
 return String(s).trim().toLowerCase().replace(/[\?\.\!\s]/g,'').replace(/[^a-z0-9]/g,'');
}

function grade(qId, userVal){
 if(state.answers[qId]!==undefined) return;
 const q=QUIZ_DATA.find(x=>x.id===qId);
 let isCorrect=false;
 let userIdx=null;

 if(q.type==='multiple' || q.type==='ox'){
  userIdx=userVal;
  isCorrect = (userVal===q.answer);
 } else {
  const normUser=normalize(userVal);
  const normAns=normalize(q.answer);
  const alt = [
   'realtosim','real2sim','howhardcanitbe','howhardcanitbe?','real to sim','how hard can it be'
  ].map(normalize);
  if(normAns==='realtosim'){
   isCorrect = ['realtosim','real2sim','realtosim'].includes(normUser) || normUser.includes('realtosim') || normUser.includes('real2sim');
  } else if(normAns==='howhardcanitbe'){
   isCorrect = normUser.includes('howhardcanitbe');
  } else {
   isCorrect = normUser===normAns;
  }
  if(!userVal || String(userVal).trim()===''){ alert('답을 입력해 주세요'); return; }
 }

 state.answers[qId]=isCorrect;
 state.solved++;
 if(isCorrect) state.correct++;

 // UI update
 const card=document.getElementById('card-'+qId);
 const body=document.getElementById('body-'+qId);
 const exp=document.getElementById('exp-'+qId);
 card.classList.add('solved');

 if(q.type==='multiple'){
  const btns=body.querySelectorAll('.opt');
  btns.forEach((b,i)=>{
   b.disabled=true;
   if(i===q.answer) b.classList.add('correct');
   if(i===userIdx && !isCorrect) b.classList.add('wrong');
  });
 } else if(q.type==='ox'){
  const btns=body.querySelectorAll('.ox-btn');
  btns.forEach((b,i)=>{
   b.disabled=true;
   if(i===q.answer) b.classList.add('correct');
   if(i===userIdx && !isCorrect) b.classList.add('wrong');
  });
 } else {
  const inp=document.getElementById('input-'+qId);
  const btn=body.querySelector('.btn');
  inp.disabled=true; btn.disabled=true;
  const res=document.createElement('div');
  res.style.marginTop='10px'; res.style.fontSize='13px';
  if(isCorrect){
   res.innerHTML=`<span style="color:#16a34a; font-weight:700">✓ 정답!</span> 정답: ${q.answer}`;
  } else {
   res.innerHTML=`<span style="color:#ef4444; font-weight:700">✗ 오답</span> 정답: ${q.answer}`;
  }
  body.appendChild(res);
 }

 exp.classList.add('show');
 updateBoard();

 if(state.solved===QUIZ_DATA.length){
  setTimeout(showFinal, 500);
 }
}

function updateBoard(){
 const rate = state.solved? Math.round(state.correct/state.solved*100):0;
 document.getElementById('solved').textContent=state.solved;
 document.getElementById('correct').textContent=state.correct;
 document.getElementById('rate').textContent=rate+'%';
 const prog=document.getElementById('prog');
 prog.style.width = (state.solved/QUIZ_DATA.length*100)+'%';
 const badge=document.getElementById('rateBadge');
 if(rate<=40){ prog.style.background='#ef4444'; badge.textContent='도전중'; }
 else if(rate<=70){ prog.style.background='#f59e0b'; badge.textContent='좋아요'; }
 else { prog.style.background='#16a34a'; badge.textContent='훌륭해요'; }
}

function showFinal(){
 const total=QUIZ_DATA.length;
 const score=state.correct;
 const pct=Math.round(score/total*100);
 let grade='D', msg='';
 if(pct>=90){ grade='A'; msg='젠슨 황의 시스템 사고를 완벽히 이해했어요! How hard can it be? 마인드로 오늘을 버텨보세요.'; }
 else if(pct>=70){ grade='B'; msg='핵심 마인드셋을 잘 잡았어요. 정직, 피벗, 제어 가능성이 포인트였죠.'; }
 else if(pct>=40){ grade='C'; msg='좋은 시작! 다시 보면 35개 경쟁사 속 생존과 $5M 기적이 더 선명해질 거예요.'; }
 else { grade='D'; msg='괜찮아요. 다시 읽고 도전하면 NVIDIA가 0→5조가 된 이유가 보입니다.'; }
 document.getElementById('finalGrade').textContent=grade;
 document.getElementById('finalScore').textContent=`${total}문제 중 ${score}문제 정답 · ${pct}%`;
 document.getElementById('finalMsg').textContent=msg;
 document.getElementById('final').classList.add('show');
}

function restartQuiz(){
 state={solved:0, correct:0, answers:{}};
 document.getElementById('final').classList.remove('show');
 render();
 window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
</body>
</html>
